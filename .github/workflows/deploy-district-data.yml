name: Deploy district data to SiteGround

on:
  push:
    branches: [main]
    paths:
      - "data/districts/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SCP district data files to SiteGround
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ssh.magen-israel.org
          port: 18765
          username: u1214-6mgzp0hmri36
          key: ${{ secrets.SITEGROUND_SSH_KEY }}
          source: "data/districts/*.json,data/districts/*.geojson"
          target: "www/preview.magen-israel.org/public_html/data/districts/"
          strip_components: 2

      - name: Chmod and purge dynamic cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.magen-israel.org
          port: 18765
          username: u1214-6mgzp0hmri36
          key: ${{ secrets.SITEGROUND_SSH_KEY }}
          script: |
            cd ~/www/preview.magen-israel.org/public_html/data/districts/
            chmod 644 *.json *.geojson 2>/dev/null || true
            wp --path=$HOME/www/magen-israel.org/public_html sg purge 2>&1 | tail -3 || true
